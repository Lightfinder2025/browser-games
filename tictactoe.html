<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
      color: #e94560;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      height: 1.5em;
      color: #a8dadc;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.x {
      color: #e94560;
    }

    .cell.o {
      color: #4cc9f0;
    }

    .cell.win {
      background: #0f3460;
      box-shadow: 0 0 18px rgba(233, 69, 96, 0.6);
    }

    #restart {
      margin-top: 2rem;
      padding: 0.7rem 2.2rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: white;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.05em;
    }

    #restart:hover {
      background: #c73652;
      transform: scale(1.05);
    }

    #scores {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .score-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.6;
    }

    .score-value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .score-x { color: #e94560; }
    .score-o { color: #4cc9f0; }
    .score-tie { color: #a8dadc; }

    #mode-toggle {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #0f3460;
    }

    #mode-toggle button {
      padding: 0.5rem 1.2rem;
      font-size: 0.9rem;
      border: none;
      background: #16213e;
      color: #aaa;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    #mode-toggle button.active {
      background: #0f3460;
      color: #eee;
    }

    #difficulty {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #0f3460;
    }

    #difficulty button {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      border: none;
      background: #16213e;
      color: #aaa;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    #difficulty button.active {
      background: #0f3460;
      color: #eee;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>

  <div id="mode-toggle">
    <button id="btn-2p" class="active" onclick="setMode('2p')">2 Players</button>
    <button id="btn-cpu" onclick="setMode('cpu')">vs Computer</button>
  </div>

  <div id="difficulty" style="display:none">
    <button id="btn-easy" onclick="setDifficulty('easy')">Easy</button>
    <button id="btn-medium" onclick="setDifficulty('medium')">Medium</button>
    <button id="btn-hard" class="active" onclick="setDifficulty('hard')">Hard</button>
  </div>

  <div id="scores">
    <div class="score-box">
      <span class="score-label">X Wins</span>
      <span class="score-value score-x" id="score-x">0</span>
    </div>
    <div class="score-box">
      <span class="score-label">Ties</span>
      <span class="score-value score-tie" id="score-tie">0</span>
    </div>
    <div class="score-box">
      <span class="score-label">O Wins</span>
      <span class="score-value score-o" id="score-o">0</span>
    </div>
  </div>

  <div id="status">Player X's turn</div>

  <div id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <button id="restart">Restart</button>

  <script>
    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');
    const restartBtn = document.getElementById('restart');
    const scoreX = document.getElementById('score-x');
    const scoreO = document.getElementById('score-o');
    const scoreTie = document.getElementById('score-tie');

    const WINS = [
      [0,1,2],[3,4,5],[6,7,8], // rows
      [0,3,6],[1,4,7],[2,5,8], // cols
      [0,4,8],[2,4,6]          // diagonals
    ];

    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let gameOver = false;
    let scores = { X: 0, O: 0, tie: 0 };
    let mode = '2p';       // '2p' or 'cpu'
    let difficulty = 'hard'; // 'easy', 'medium', 'hard'

    function setMode(m) {
      mode = m;
      document.getElementById('btn-2p').classList.toggle('active', m === '2p');
      document.getElementById('btn-cpu').classList.toggle('active', m === 'cpu');
      document.getElementById('difficulty').style.display = m === 'cpu' ? 'flex' : 'none';
      scores = { X: 0, O: 0, tie: 0 };
      scoreX.textContent = scoreO.textContent = scoreTie.textContent = 0;
      restart();
    }

    function setDifficulty(d) {
      difficulty = d;
      ['easy','medium','hard'].forEach(lvl =>
        document.getElementById('btn-' + lvl).classList.toggle('active', lvl === d)
      );
      restart();
    }

    function checkWinner(b = board) {
      for (const [a, bc, c] of WINS) {
        if (b[a] && b[a] === b[bc] && b[a] === b[c]) {
          return { winner: b[a], line: [a, bc, c] };
        }
      }
      if (b.every(cell => cell)) return { winner: null, tie: true };
      return null;
    }

    // --- Minimax AI ---
    function minimax(b, isMaximizing) {
      const result = checkWinner(b);
      if (result) {
        if (result.winner === 'O') return 10;
        if (result.winner === 'X') return -10;
        return 0;
      }
      if (isMaximizing) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) {
            b[i] = 'O';
            best = Math.max(best, minimax(b, false));
            b[i] = null;
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) {
            b[i] = 'X';
            best = Math.min(best, minimax(b, true));
            b[i] = null;
          }
        }
        return best;
      }
    }

    function getBestMove() {
      let bestVal = -Infinity, bestMove = -1;
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'O';
          const val = minimax(board, false);
          board[i] = null;
          if (val > bestVal) { bestVal = val; bestMove = i; }
        }
      }
      return bestMove;
    }

    function getRandomMove() {
      const empty = board.map((v,i) => v ? null : i).filter(i => i !== null);
      return empty[Math.floor(Math.random() * empty.length)];
    }

    function getCPUMove() {
      if (difficulty === 'easy') return getRandomMove();
      if (difficulty === 'hard') return getBestMove();
      // medium: best move 50% of the time
      return Math.random() < 0.5 ? getBestMove() : getRandomMove();
    }

    function placeMove(idx, player) {
      board[idx] = player;
      cells[idx].textContent = player;
      cells[idx].classList.add(player.toLowerCase(), 'taken');
    }

    function finishTurn() {
      const result = checkWinner();
      if (result) {
        gameOver = true;
        if (result.winner) {
          result.line.forEach(i => cells[i].classList.add('win'));
          const label = (mode === 'cpu' && result.winner === 'O') ? 'Computer wins!' : `Player ${result.winner} wins!`;
          status.textContent = label;
          scores[result.winner]++;
        } else {
          status.textContent = "It's a tie!";
          scores.tie++;
        }
        scoreX.textContent = scores.X;
        scoreO.textContent = scores.O;
        scoreTie.textContent = scores.tie;
        return true;
      }
      return false;
    }

    function handleClick(e) {
      const idx = parseInt(e.target.dataset.index);
      if (gameOver || board[idx]) return;
      if (mode === 'cpu' && currentPlayer === 'O') return; // block clicks during CPU turn

      placeMove(idx, currentPlayer);
      if (finishTurn()) return;

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';

      if (mode === 'cpu' && currentPlayer === 'O') {
        status.textContent = 'Computer is thinking…';
        cells.forEach(c => c.style.pointerEvents = 'none');
        setTimeout(() => {
          const cpuIdx = getCPUMove();
          placeMove(cpuIdx, 'O');
          cells.forEach(c => c.style.pointerEvents = '');
          if (finishTurn()) return;
          currentPlayer = 'X';
          status.textContent = "Your turn (X)";
        }, 400);
      } else {
        status.textContent = mode === 'cpu' ? "Your turn (X)" : `Player ${currentPlayer}'s turn`;
      }
    }

    function restart() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
        cell.style.pointerEvents = '';
      });
      status.textContent = mode === 'cpu' ? "Your turn (X)" : "Player X's turn";
    }

    cells.forEach(cell => cell.addEventListener('click', handleClick));
    restartBtn.addEventListener('click', restart);
  </script>
</body>
</html>
